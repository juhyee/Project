<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixed Ratio Layout</title>
  <style>
    /* 기본 스타일 */
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      /* 스크롤 방지 */
      background-color: #1a1a1a;
      /* 배경색 맞춰주기 */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 스케일될 컨테이너 */
    #scaler {
      /* 이미지에서 측정된 너비/높이 (예시 값, 실제 이미지 비율에 맞춰 수정) */
      /* 현재 주신 이미지 해상도를 제가 1080x1920 (가로:세로 = 0.5625)으로 가정합니다. */
      width: 1080px;
      height: 1920px;

      /* 이 컨테이너는 화면 중앙에 고정될 것이므로, 위치 설정 */
      position: absolute;
      transform-origin: top left;
      /* 왼쪽 위를 기준으로 스케일 */

      /* 이미지 배경색과 동일하게 (잘릴 때 대비) */
      background-color: #1a1a1a;
    }

    /* ======================================================================
         * #scaler 내부의 콘텐츠 스타일 (이미지 그대로의 폰트, 여백, 색상 등)
         * ====================================================================== */
    /* 헤더 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 20px;
      /* PC 이미지 비율 기준으로 px 값 */
      color: #fff;
      font-size: 16px;
    }

    header .vision-text {
      font-weight: bold;
    }

    header .icons img {
      width: 24px;
      height: 24px;
      margin-left: 10px;
    }

    /* Vision 섹션 */
    .vision-section {
      padding: 0 20px 40px;
      color: #fff;
    }

    .vision-section .heading {
      font-size: 32px;
      /* 이미지 폰트 크기 */
      line-height: 1.3;
      margin-bottom: 20px;
    }

    .vision-section .sub-text {
      font-size: 16px;
      color: #ccc;
    }

    /* 카드 섹션 */
    .card-section {
      background-color: #222;
      /* 카드 배경색 */
      margin-bottom: 10px;
      padding: 20px;
      color: #fff;
      border-radius: 8px;
      overflow: hidden;
      /* 배경 이미지 처리 */
      position: relative;
    }

    .card-section::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://picsum.photos/id/1015/800/600');
      /* 카드별 배경 이미지 */
      background-size: cover;
      background-position: center;
      opacity: 0.3;
      /* 이미지 투명도 조절 */
      z-index: 1;
    }

    .card-section>* {
      position: relative;
      z-index: 2;
    }

    .card-section .category {
      font-size: 14px;
      color: #6cff8a;
      /* 녹색 */
      margin-bottom: 10px;
      font-weight: bold;
    }

    .card-section .title {
      font-size: 24px;
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .card-section .description {
      font-size: 14px;
      color: #ccc;
    }
  </style>
</head>

<body>
  <div id="scaler">
    <header>
      <div class="vision-text">Our Vision</div>
      <div class="icons">
        <img src="https://via.placeholder.com/24/cccccc/000000?text=🌍" alt="World">
        <img src="https://via.placeholder.com/24/cccccc/000000?text=☰" alt="Menu">
      </div>
    </header>

    <section class="vision-section">
      <h2 class="heading">창작과 선교의 상생 플랫폼<br>복음의 시작</h2>
    </section>

    <section class="card-section">
      <div class="category">Missionary Gate</div>
      <div class="title">한류 문화로 열리는 선교의 문</div>
      <div class="description">K-Culture친화성을 활용 비종교국가의 정서적 장벽해소</div>
    </section>

    <section class="card-section">
      <div class="category">Global Expansion</div>
      <div class="title">디지털 선교를 통한 글로벌 확장</div>
      <div class="description">선교사와 젊은 창작자의 자발적인 OTT 방송과 암호화폐 기반 국경 없는 기부참여</div>
    </section>

    <section class="card-section">
      <div class="category">Win-Win Structure</div>
      <div class="title">크리에이터와 선교사의 상생 구조</div>
      <div class="description">젊은 창작자는 작품을 통해 수익을 창출하고 선교사에게 자발적인 선교를 지원합니다.</div>
    </section>
  </div>

  <script>
    const scaler = document.getElementById('scaler');
    // 주신 이미지의 실제 해상도를 정확히 측정하여 입력해야 합니다.
    // 현재 제가 임의로 1080x1920으로 가정했습니다.
    const originalWidth = 414; // 이미지에서 측정된 너비 (ex: 아이폰 X 실제 해상도)
    const originalHeight = 896; // 이미지에서 측정된 높이

    function scaleContent() {
      const currentWindowWidth = window.innerWidth;
      const currentWindowHeight = window.innerHeight;

      const originalRatio = originalWidth / originalHeight;
      const currentWindowRatio = currentWindowWidth / currentWindowHeight;

      let scaleFactor;
      let offsetX = 0;
      let offsetY = 0;

      if (currentWindowRatio > originalRatio) {
        // 현재 창이 원본보다 가로가 더 넓은 경우 (세로를 기준으로 스케일)
        scaleFactor = currentWindowHeight / originalHeight;
        // 가로 여백 계산 및 중앙 정렬
        offsetX = (currentWindowWidth - originalWidth * scaleFactor) / 2;
      } else {
        // 현재 창이 원본보다 세로가 더 긴 경우 (가로를 기준으로 스케일)
        scaleFactor = currentWindowWidth / originalWidth;
        // 세로 여백 계산 및 중앙 정렬
        offsetY = (currentWindowHeight - originalHeight * scaleFactor) / 2;
      }

      scaler.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scaleFactor})`;
    }

    // 초기 로드 시 스케일 적용
    scaleContent();

    // 창 크기 변경 시 스케일 재적용
    window.addEventListener('resize', scaleContent);
  </script>
</body>

</html>
